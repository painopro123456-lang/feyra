name: Windows build and release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example 0.1.0. Leave blank to build a preview."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.release_version != '') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/Feyra/Feyra.csproj
      - run: dotnet build src/Feyra/Feyra.csproj --configuration Release --no-restore
      - name: Audit vulnerable NuGet dependencies
        run: dotnet list src/Feyra/Feyra.csproj package --vulnerable --include-transitive
      - run: dotnet publish src/Feyra/Feyra.csproj --configuration Release --output artifacts/Feyra --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: Feyra-Windows-preview
          path: artifacts/Feyra/**
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Determine and validate release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REQUESTED_VERSION) {
            $version = $env:REQUESTED_VERSION.Trim()
          } else {
            $version = $env:REF_NAME.TrimStart("v")
          }
          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version. Use a version such as 0.1.0."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet restore src/Feyra/Feyra.csproj
      - run: dotnet publish src/Feyra/Feyra.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/Feyra
      - run: dotnet tool install vpk --version 1.2.161
      - name: Create installer and update packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          vpk pack --packId Feyra --packVersion $env:RELEASE_VERSION --packDir artifacts/Feyra --mainExe Feyra.exe --outputDir artifacts/releases
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: artifacts/releases/*
          generate_release_notes: true
